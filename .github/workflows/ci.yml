name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # Plain PostgreSQL, like the host database. The PostGIS image installs
      # the TIGER geocoder tables, which `alembic check` reports as drift;
      # Day 7 switches back to PostGIS and filters those out.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: veloce
          POSTGRES_PASSWORD: veloce
          POSTGRES_DB: veloce
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U veloce -d veloce"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://veloce:veloce@localhost:5432/veloce
      TEST_DATABASE_URL: postgresql+asyncpg://veloce:veloce@localhost:5432/veloce_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-not-a-secret-ci-only-not-a-secret-ci-only
      LOG_JSON: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Create the test database
        run: PGPASSWORD=veloce psql -h localhost -U veloce -d veloce -c "CREATE DATABASE veloce_test"

      - name: Migrations apply cleanly and match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Migrations can be rolled back and reapplied
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build
