<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Veloce: delivery and dispatch that stays correct under pressure." />
    <title>Veloce</title>
    <script>
      // Apply the theme before first paint, so a dark-mode user never sees a white flash.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('veloce.theme'); } catch (e) {}
        var dark = saved === 'dark' ||
          (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
